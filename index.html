<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAF9F6">
  <meta name="description" content="A quiet reading room for LLM and LangChain learning notes — fundamentals, prompt engineering, provider APIs, structured outputs, memory, and streaming.">
  <title>llmnote — LLM &amp; LangChain learning notes</title>
  <script>
    (function () {
      var theme;
      try {
        theme = localStorage.getItem("llmnote-theme");
      } catch (error) {
        /* storage may be unavailable from file:// */
      }
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#121310" : "#FAF9F6");
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314161A'/%3E%3Cpath d='M16 5.5l2.3 8.2 8.2 2.3-8.2 2.3L16 26.5l-2.3-8.2-8.2-2.3 8.2-2.3z' fill='%23FAF9F6'/%3E%3Ccircle cx='24.5' cy='7.5' r='1.4' fill='%23FAF9F6'/%3E%3Ccircle cx='7.5' cy='24.5' r='1' fill='%23FAF9F6'/%3E%3C/svg%3E">

  <script src="vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: "rgb(var(--paper-rgb) / <alpha-value>)",
            "paper-2": "rgb(var(--paper-2-rgb) / <alpha-value>)",
            surface: "rgb(var(--surface-rgb) / <alpha-value>)",
            ink: "rgb(var(--ink-rgb) / <alpha-value>)",
            "ink-2": "rgb(var(--ink-2-rgb) / <alpha-value>)",
            muted: "rgb(var(--muted-rgb) / <alpha-value>)",
            faint: "rgb(var(--faint-rgb) / <alpha-value>)",
            line: "rgb(var(--line-rgb) / <alpha-value>)",
            "line-2": "rgb(var(--line-2-rgb) / <alpha-value>)",
            accent: "rgb(var(--accent-rgb) / <alpha-value>)",
            "accent-2": "rgb(var(--accent-2-rgb) / <alpha-value>)",
            "accent-wash": "rgb(var(--accent-wash-rgb) / <alpha-value>)",
            code: "rgb(var(--code-rgb) / <alpha-value>)",
            "code-2": "rgb(var(--code-2-rgb) / <alpha-value>)",
            "code-line": "rgb(var(--code-line-rgb) / <alpha-value>)",
            "code-ink": "rgb(var(--code-ink-rgb) / <alpha-value>)"
          },
          fontFamily: {
            sans: ["Geist", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "Helvetica", "Arial", "sans-serif"],
            mono: ["Geist Mono", "ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace"]
          },
          boxShadow: {
            pop: "0 1px 2px rgba(20,22,26,.06),0 12px 32px -12px rgba(20,22,26,.18)"
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="vendor/highlight-github-dark.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="h-dvh overflow-hidden bg-paper font-sans text-ink antialiased">
  <a href="#main" class="sr-only z-[60] rounded-md border border-line bg-surface px-3 py-2 text-sm text-ink focus:not-sr-only focus:fixed focus:left-3 focus:top-3">Skip to content</a>

  <div class="flex h-dvh overflow-hidden">
    <div id="scrim" class="fixed inset-0 z-40 hidden bg-ink/25 backdrop-blur-[2px] lg:hidden"></div>

    <aside id="sidebar" aria-label="Notes" class="fixed inset-y-0 left-0 z-50 flex w-[272px] -translate-x-full flex-col overscroll-contain overflow-y-auto border-r border-line bg-paper px-3 pb-3 pt-4 transition-transform duration-200 ease-out lg:static lg:translate-x-0">
      <div class="flex items-center gap-2.5 px-2 pb-7 pt-1">
        <a id="brand-home" href="#overview" class="flex min-w-0 items-center gap-2.5 rounded-md" aria-label="llmnote, go to the first note">
          <span class="brand-mark grid h-6 w-6 flex-none place-items-center rounded-md bg-ink text-paper">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2.5l1.9 6.6 6.6 1.9-6.6 1.9L12 19.5l-1.9-6.6L3.5 11l6.6-1.9z"></path>
              <circle cx="19.2" cy="4.8" r="1.1"></circle>
              <circle cx="4.8" cy="19.2" r="0.8"></circle>
            </svg>
          </span>
          <span class="truncate text-[19px] font-semibold leading-none tracking-[-0.03em]">llmnote<span class="ml-0.5 align-super font-mono text-[8.5px] font-normal tracking-normal text-accent-2">langchain</span></span>
        </a>
        <button id="sidebar-close" type="button" class="ml-auto grid h-8 w-8 flex-none place-items-center rounded-md text-faint transition-colors hover:bg-paper-2 hover:text-ink lg:hidden" aria-label="Close note menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>

      <div class="flex items-center justify-between px-2.5 pb-2">
        <p class="font-mono text-[10px] font-medium uppercase tracking-[0.13em] text-faint">Study guide</p>
        <span id="note-count" class="font-mono text-[9.5px] text-faint">00</span>
      </div>

      <nav id="note-nav" class="flex flex-col gap-0.5" aria-label="Study guide"></nav>

      <div class="mt-auto px-1 pt-6">
        <div class="border-t border-line pt-3">
          <div class="flex items-center gap-2.5 rounded-md px-1.5 py-1.5">
            <span class="grid h-7 w-7 flex-none place-items-center rounded-full border border-accent/20 bg-accent-wash font-mono text-[9px] font-medium text-accent">AI</span>
            <div class="min-w-0">
              <p id="active-file" class="truncate font-mono text-[10px] text-ink-2"></p>
              <p id="notes-summary" class="mt-0.5 font-mono text-[9px] text-faint"></p>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="z-30 flex h-[54px] flex-none items-center gap-3 border-b border-line bg-paper/90 px-4 backdrop-blur-md sm:px-6">
        <button id="menu-btn" type="button" class="grid h-8 w-8 flex-none place-items-center rounded-md text-ink-2 transition-colors hover:bg-paper-2 hover:text-ink lg:hidden" aria-label="Open note menu" aria-controls="sidebar" aria-expanded="false">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>

        <nav class="flex min-w-0 flex-1 items-center gap-2 text-[12.5px]" aria-label="Breadcrumb">
          <span class="hidden flex-none text-faint sm:inline">Notes</span>
          <span class="hidden flex-none text-faint/60 sm:inline" aria-hidden="true">/</span>
          <span id="crumb-title" class="truncate font-medium text-ink">Loading notes</span>
        </nav>

        <div class="flex flex-none items-center gap-2.5">
          <span id="top-level" class="hidden font-mono text-[10px] uppercase tracking-[0.12em] text-faint sm:inline"></span>
          <span class="hidden h-3.5 w-px bg-line sm:inline-block" aria-hidden="true"></span>
          <span class="rounded border border-line-2 bg-paper-2 px-1.5 py-1 font-mono text-[9.5px] font-medium uppercase tracking-[0.08em] text-muted">MD</span>
          <button id="theme-toggle" type="button" class="theme-toggle grid h-8 w-8 flex-none place-items-center rounded-md border border-line bg-surface text-muted transition-colors hover:bg-paper-2 hover:text-ink" aria-label="Switch to dark theme" title="Switch to dark theme">
            <svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5z"></path>
            </svg>
            <svg class="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
          </button>
        </div>
      </header>

      <main id="main" tabindex="-1" class="flex min-h-0 flex-1 flex-col overflow-y-auto bg-paper outline-none focus-visible:outline focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">
        <article class="mx-auto w-full max-w-[860px] px-5 pb-16 pt-9 sm:px-9 sm:pt-12 lg:pt-14">
          <div class="mb-6 flex items-center gap-3">
            <span class="font-mono text-[10px] font-medium uppercase tracking-[0.13em] text-accent-2">LLM &amp; LangChain Learning Notes</span>
            <span class="h-px flex-1 bg-line" aria-hidden="true"></span>
            <span id="article-time" class="flex-none font-mono text-[10px] uppercase tracking-[0.1em] text-faint"></span>
          </div>
          <div id="content" class="prose-notes"></div>
        </article>

        <footer class="mt-auto border-t border-line/80">
          <div class="mx-auto flex max-w-[860px] flex-wrap items-center justify-between gap-4 px-5 py-5 sm:px-9">
            <p class="font-mono text-[10px] uppercase tracking-[0.09em] text-faint">Local markdown notes</p>
            <button id="to-top" type="button" class="inline-flex items-center gap-1.5 rounded-md px-2 py-1.5 font-mono text-[10px] uppercase tracking-[0.09em] text-muted transition-colors hover:bg-paper-2 hover:text-ink">
              Back to top
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5M5 12l7-7 7 7"></path>
              </svg>
            </button>
          </div>
        </footer>
      </main>
    </div>
  </div>

  <nav id="minimap" class="minimap" aria-label="Note minimap"></nav>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="notes.js"></script>
  <script src="app.js"></script>
</body>
</html>
